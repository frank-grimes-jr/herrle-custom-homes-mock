name: Release

# Every merge to main is built ONCE, here, and published as a GitHub Release.
# Dave's laptop picks it up on its own within ~30 min (scripts/supervisor.mjs):
# it never runs git, npm or a build. Windows runner so the bundle carries the
# Windows keyring binary and a Windows node.exe.
#
# Roll back: delete the bad release — the laptop installs whatever "latest" is.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      VERSION: build-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/package-release.mjs "$env:VERSION"

      # Unzip exactly what the laptop will get and boot it the way the laptop
      # does (via the supervisor). A release that can't start never ships —
      # which matters, because a broken supervisor couldn't update itself.
      - name: Smoke test the packaged app
        shell: bash
        run: |
          d="smoke/app/$VERSION"
          mkdir -p "$d" smoke/data
          /c/Windows/System32/tar.exe -xf dist/herrle-dashboard-win-x64.zip -C "$d"
          HERRLE_RELEASES_API=http://127.0.0.1:9/ HERRLE_DATA_DIR="$(cygpath -w "$PWD/smoke/data")" \
            "$d/node.exe" "$d/supervisor.mjs" > /dev/null 2>&1 &
          pid=$!
          ok=1
          for i in $(seq 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/admin; then echo "up after ${i}s"; ok=0; break; fi
            sleep 1
          done
          kill $pid || true
          [ $ok = 0 ] || { cat smoke/data/logs/app.log; exit 1; }

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$env:VERSION"
          dist/herrle-dashboard-win-x64.zip dist/herrle-dashboard-win-x64.zip.sha256 scripts/install.cmd
          --target "${{ github.sha }}" --title "$env:VERSION" --notes "Automatic build of ${{ github.sha }}" --latest
